[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fingertip-design-framework"
version = "0.1.0"
description = "Parametric fingertip geometry, Newton mechanics, OptiX transport, and scientific optimization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
]

[project.optional-dependencies]
mesh = ["gmsh>=4.12"]
validation = ["scipy>=1.11"]
optix = [
  "pyoptix",
  "cupy-cuda13x",
  "cuda-python",
]
gui = [
  "nicegui==3.14.0",
  "matplotlib>=3.8",
]
test = ["pytest>=8"]
ax = [
  "ax-platform==1.3.1",
]
physics = [
  "newton==1.4.0",
  "warp-lang==1.16.0",
]

[tool.setuptools.packages.find]
include = [
  "model*",
  "mesh*",
  "contact*",
  "physics*",
  "validation*",
  "optics*",
  "optimization*",
  "gui*",
  "util*",
]

[tool.setuptools.package-data]
"optics.transport3d" = ["kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/smoke"]
markers = [
  "smoke: dependency wiring smoke test",
  "gmsh: requires the Gmsh Python API",
  "slow: takes materially longer than a unit test",
  "physics: requires NVIDIA Warp/Newton and CUDA",
]
