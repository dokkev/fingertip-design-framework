[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fingertip-design-framework"
version = "0.1.0"
description = "Parametric fingertip geometry, Newton mechanics, OptiX transport, and scientific optimization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
mesh = ["gmsh>=4.12"]
validation = ["scipy>=1.11"]
optix = [
  "pyoptix==9.1.0",
  "cupy-cuda13x",
  "cuda-python",
]
gui = [
  "nicegui==3.14.0",
  "matplotlib>=3.8",
]
test = ["pytest>=8"]
ax = [
  "ax-platform==1.3.1",
]
physics = [
  "meshio>=5.3",
  "newton==1.5.0",
  "warp-lang==1.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumo*"]

[tool.setuptools.package-data]
"lumo" = [
  "assets/objects/*.urdf",
  "assets/objects/urdf/*.urdf",
]
"lumo.ray_tracing" = ["kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
