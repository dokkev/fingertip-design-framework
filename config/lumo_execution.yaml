# Expert-owned numerical configuration for the production LUMO BO path.
#
# load_lumo_execution_config() owns this schema, requires every
# key below, converts the YAML once into typed domain settings, and reports the
# source path plus full key path for invalid values. The evaluator must never
# inspect this raw YAML mapping.

# Version of this YAML schema, not the scientific objective or result schema.
schema_version: 1

runtime:
  # CUDA device on which Newton/Warp and OptiX execute.
  device: cuda:0

mesh:
  # Named meshing policy used for optimization candidates.
  tier: search
  # Requested characteristic tetrahedral edge size, in millimetres.
  target_size_mm: 1.5
  # Smallest accepted tetrahedron quality on the repository's quality scale.
  minimum_quality: 0.02

newton:
  # Number of icosphere subdivision rounds used for the rigid spherical indenter.
  sphere_subdivisions: 3
  # Largest post-contact indentation increment solved in one step, in millimetres.
  max_load_increment_mm: 0.05
  # Number of VBD solver iterations executed for each mechanics step.
  vbd_iterations: 10
  # Mechanics integration timestep, in seconds.
  dt_s: 1.0e-3
  # Newton soft-contact activation margin, in millimetres.
  soft_contact_margin_mm: 0.02
  # Newton soft-contact elastic coefficient used by the current contact model.
  soft_contact_ke: 1.0e+3
  # Newton soft-contact damping coefficient used by the current contact model.
  soft_contact_kd: 10.0
  # Coulomb friction coefficient used by Newton soft contact.
  soft_contact_mu: 0.0
  # Target voxel width for the rigid-indenter SDF, in millimetres.
  rigid_sdf_target_voxel_mm: 0.125
  # Largest accepted displacement of a fixed support vertex, in millimetres.
  max_support_displacement_mm: 1.0e-9
  # Largest accepted rigid-indenter pose error at a checkpoint, in millimetres.
  max_final_pose_error_mm: 1.0e-6
  # Carrier penetration limit expressed as a fraction of one SDF voxel.
  max_carrier_penetration_voxel_fraction: 0.5


indentation:
  # Coarse translation step used to bracket first contact, in millimetres.
  coarse_step_mm: 0.25
  # Bisection tolerance used to refine first contact, in millimetres.
  tolerance_mm: 1.0e-3
  # Clear-side distance between first contact and the Newton spawn pose, in millimetres.
  spawn_clearance_mm: 0.05
  # Maximum allowed first-contact search travel, in millimetres.
  max_travel_mm: 20.0

transport:
  # Number of optical rays launched for one checkpoint state.
  ray_count: 256
  # Largest number of surface interactions followed for one ray.
  max_interactions: 6
  # Ray weight below which transport terminates the ray.
  minimum_ray_weight: 1.0e-4
  # Hard upper bound on all traced ray segments in one launch.
  maximum_segment_count: 4096
  # Hard upper bound on periodic representative-cell wraps for one ray.
  maximum_periodic_wraps: 8
  # Depth of the periodic 3D representative cell, in millimetres.
  extrusion_depth_mm: 11.0
  # Number of bins along the compliant surface's parametric u direction.
  surface_u_bins: 32
  # Number of bins along the representative cell's periodic z direction.
  surface_z_bins: 16
  # Number of x bins in the internal optical path field.
  internal_grid_width: 32
  # Number of y bins in the internal optical path field.
  internal_grid_height: 32
  # Number of z bins in the internal optical path field.
  internal_z_bins: 8
  # Largest number of deposition samples taken along one internal ray segment.
  internal_max_samples_per_segment: 32
  # Fixed internal field extent along x, in millimetres.
  x_bounds_mm: [-16.0, 16.0]
  # Fixed internal field extent along y, in millimetres.
  y_bounds_mm: [-31.0, 4.5]
  # Offset applied to a newly emitted ray to avoid self-intersection, in millimetres.
  source_epsilon_mm: 1.0e-5
  # Geometric tolerance used by ray/surface intersection, in millimetres.
  intersection_epsilon_mm: 1.0e-6
  # Largest accepted residual in optical energy bookkeeping.
  energy_balance_tolerance: 1.0e-5
  # Whether the full internal path field is retained for the objective/artifact.
  retain_internal_path_field: true
  # Whether reaching the periodic-wrap bound terminates the affected ray.
  terminate_on_periodic_wrap_limit: true
  # Whether a ray with no next event terminates instead of being treated as an error.
  terminate_on_no_event: true
