# Visualization configuration for persisted LUMO optical fields.
#
# These bounds define the displayed optical-field domain. They are intentionally
# separate from numerical transport settings such as ray count, grid
# resolution, interaction limits, and termination policy.

schema_version: 1

optical_field:
  # Inclusive x domain [minimum, maximum], in millimetres.
  x_bounds_mm: [-16.0, 16.0]
  # Inclusive y domain [minimum, maximum], in millimetres.
  y_bounds_mm: [-31.0, 4.5]
